services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cefa-tv-core-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${DB_NAME:-cefatv}
      - DB_USER=${DB_USER:-cefatv}
      - DB_PASSWORD=${DB_PASSWORD:-cefatv}
      - S3_ENDPOINT=http://garage:3900
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?define S3_ACCESS_KEY en .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?define S3_SECRET_KEY en .env}
    depends_on:
      db:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    ports:
      - '${SERVER_PORT:-8080}:8080'
    volumes:
      - cefa-tv-core-tmp:/app/tmp
    networks:
      - cefa-tv-net
      - internal

  db:
    image: postgres:16-alpine
    container_name: cefa-tv-core-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-cefatv}
      - POSTGRES_USER=${DB_USER:-cefatv}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cefatv}
    volumes:
      - cefa-tv-core-db-data:/var/lib/postgresql/data
    ports:
      - '${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-cefatv} -d ${DB_NAME:-cefatv}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  garage:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.1.0}
    container_name: cefa-tv-core-garage
    restart: unless-stopped
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?define GARAGE_RPC_SECRET en .env}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - cefa-tv-core-garage-meta:/var/lib/garage/meta
      - cefa-tv-core-garage-data:/var/lib/garage/data
    ports:
      - '${S3_BIND_ADDRESS:-127.0.0.1}:${S3_API_PORT:-3900}:3900'
    networks:
      - internal

  garage-init:
    build:
      context: ./garage
      args:
        GARAGE_IMAGE: ${GARAGE_IMAGE:-dxflrs/garage:v2.1.0}
    container_name: cefa-tv-core-garage-init
    restart: 'no'
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?define GARAGE_RPC_SECRET en .env}
      - GARAGE_CAPACITY=${GARAGE_CAPACITY:-100G}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?define S3_ACCESS_KEY en .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?define S3_SECRET_KEY en .env}
      - S3_BUCKET=${S3_BUCKET:-cefa-tv-media}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - cefa-tv-core-garage-meta:/var/lib/garage/meta:ro
    depends_on:
      - garage
    networks:
      - internal

  discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: cefa-tv-core-discovery
    restart: unless-stopped
    network_mode: host
    environment:
      - API_PORT=${SERVER_PORT:-8080}
      - PUBLIC_URL=${PUBLIC_URL:-}

volumes:
  cefa-tv-core-db-data:
  cefa-tv-core-garage-meta:
  cefa-tv-core-garage-data:
  cefa-tv-core-tmp:

networks:
  cefa-tv-net:
    name: cefa-tv-net
    external: true
  internal:
    driver: bridge
