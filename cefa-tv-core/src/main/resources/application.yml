server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: cefa-tv-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cefatv}
    username: ${DB_USER:cefatv}
    password: ${DB_PASSWORD:cefatv}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8GB
      max-request-size: 8GB
      file-size-threshold: 2MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

cefa:
  tv:
    public-url: ${PUBLIC_URL:}
    app-base-url: ${APP_BASE_URL:http://localhost:4000}
    microsoft:
      tenant-id: ${AZURE_TENANT_ID:}
      client-id: ${AZURE_CLIENT_ID:}
      client-secret: ${AZURE_CLIENT_SECRET:}
      redirect-uri: ${AZURE_REDIRECT_URI:}
      auto-provision: ${MICROSOFT_AUTO_PROVISION:false}
      default-group-id: ${MICROSOFT_DEFAULT_GROUP_ID:}
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      ttl-hours: 12
      cookie-secure: ${COOKIE_SECURE:false}
    admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
    storage:
      endpoint: ${S3_ENDPOINT:http://localhost:3900}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket: ${S3_BUCKET:cefa-tv-media}
      region: ${S3_REGION:garage}
    aracast:
      command-port: ${ARACAST_COMMAND_PORT:5401}
      command-timeout-ms: ${ARACAST_COMMAND_TIMEOUT_MS:10000}
      ftp-port: ${ARACAST_FTP_PORT:5481}
      ftp-user: ${ARACAST_FTP_USER:user}
      ftp-password: ${ARACAST_FTP_PASSWORD:}
      ftp-timeout-ms: ${ARACAST_FTP_TIMEOUT_MS:600000}
      ssh-user: ${ARACAST_SSH_USER:root}
      ssh-passwords: ${ARACAST_SSH_PASSWORDS:}
      ssh-timeout-ms: ${ARACAST_SSH_TIMEOUT_MS:10000}
      secret-key: ${ARACAST_SECRET_KEY:}
      ntp-servers: ${ARACAST_NTP_SERVERS:10.21.34.10,10.21.35.2}
      discovery:
        port: ${ARACAST_DISCOVERY_PORT:30333}
        wait-ms: ${ARACAST_DISCOVERY_WAIT_MS:1500}
        max-hosts: ${ARACAST_DISCOVERY_MAX_HOSTS:2048}
    media:
      ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${FFPROBE_PATH:ffprobe}
      pdf-dpi: 110
      temp-dir: ${MEDIA_TEMP_DIR:}
      compression:
        enabled: ${MEDIA_COMPRESSION_ENABLED:true}
        max-width: ${MEDIA_COMPRESSION_MAX_WIDTH:1920}
        max-height: ${MEDIA_COMPRESSION_MAX_HEIGHT:1080}
        image-quality: ${MEDIA_COMPRESSION_IMAGE_QUALITY:4}
        video-crf: ${MEDIA_COMPRESSION_VIDEO_CRF:23}
        video-preset: ${MEDIA_COMPRESSION_VIDEO_PRESET:fast}
        audio-bitrate: ${MEDIA_COMPRESSION_AUDIO_BITRATE:128k}
        video-timeout-minutes: ${MEDIA_COMPRESSION_VIDEO_TIMEOUT_MINUTES:120}
        min-saving-percent: ${MEDIA_COMPRESSION_MIN_SAVING_PERCENT:5}
    manifest:
      debounce-ms: 2000
    player:
      poll-interval-sec: 30
      online-window-sec: 90
      never-connected-flag-days: ${NEVER_CONNECTED_FLAG_DAYS:7}
      never-connected-delete-days: ${NEVER_CONNECTED_DELETE_DAYS:14}
      repo-url: ${PLAYER_REPO_URL:ssh://git@git.cefa.es:2222/it/cefa-tv-player.git}
    shell:
      idle-timeout-sec: 900
      max-duration-sec: 7200
